[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trickloop"
version = "0.1.0"
description = "A self-contained example of an automatic improvement loop on a small pirate trick-taking game"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Anthony Hunt" }]
dependencies = []

[tool.setuptools]
packages = ["trickloop"]
